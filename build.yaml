overview: "Remove items from Continue Watching without losing playback progress."
description: >
  Adds a per user hidden list for the Continue Watching and Next Up rows. Hidden items are filtered out
  of the resume and next up endpoints for every client, while the playback position is kept, so resuming
  the item later continues where it stopped. Hiding an episode also suppresses its series from Next Up
  until something from that series is played again.
