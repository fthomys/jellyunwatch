name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: check version
        run: |
          VERSION="$(grep -E '^version:' build.yaml | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          if [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match build.yaml version $VERSION" >&2
            exit 1
          fi

      - name: package
        run: ./build/package.sh

      - name: update manifest
        env:
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          TAG: ${{ github.ref_name }}
        run: ./build/update-manifest.sh

      - name: commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "manifest for ${{ github.ref_name }}"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: bin/jelly-unwatch_*.zip
          generate_release_notes: true
